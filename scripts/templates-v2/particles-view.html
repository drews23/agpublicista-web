<section class="pi-studio" aria-label="{{piStudio}}">
  <div class="pi-artboard">
    <div class="pi-artboard-head">
      <span class="pi-state"><span class="pi-live-dot" aria-hidden="true"></span><span data-motion-label>{{piIdle}}</span></span>
      <div class="pi-preview-actions">
        <span class="pi-source-label" data-source-label>{{piLandscape}}</span>
        <button type="button" class="pi-try v2-button" data-center-pulse>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m12 2 1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9L12 2Zm7 12v6m-3-3h6"/></svg>
          <span>{{piPreviewEffect}}</span>
        </button>
      </div>
    </div>
    <div class="pi-frame" data-particle-frame data-loading="true" data-render-state="loading">
      <div class="pi-viewport">
        <canvas data-particle-canvas role="img" aria-label="{{piCanvasLabel}}"></canvas>
        <canvas data-particle-static role="img" aria-label="{{piStaticCanvas}}" hidden></canvas>
      </div>
    </div>
    <div class="pi-stage-note">
      <p>{{piPointerHint}}</p>
    </div>
    <p class="pi-fallback" data-fallback role="status" hidden>{{fallback}}</p>
  </div>
  <form class="pi-hero-controls" data-particle-settings aria-label="{{piSettings}}">
    <div class="pi-inputs">
      <h2 class="pi-field-title" id="pi-source-heading">{{piSource}}</h2>
      <div class="pi-image-options" role="group" aria-labelledby="pi-source-heading">
        <button class="pi-preset" type="button" data-preset="landscape" aria-pressed="true">{{piLandscape}}</button>
        <label class="pi-upload v2-upload v2-button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M4 16v5h16v-5"/></svg>
          <span>{{upload}}</span><input type="file" data-upload accept="image/png,image/jpeg,image/webp" aria-label="{{upload}}" aria-describedby="pi-upload-note">
        </label>
      </div>
      <p class="pi-note" id="pi-upload-note">{{piUploadNote}}</p>
      <label class="pi-framing">{{piFraming}}
        <select name="framing" aria-describedby="pi-framing-note">
          <option value="hero">{{piHeroFormat}}</option>
          <option value="contain">{{piFitComplete}}</option>
          <option value="cover">{{piFitCover}}</option>
        </select>
      </label>
      <p class="pi-note" id="pi-framing-note">{{piFramingNote}}</p>
    </div>
    <details class="pi-advanced">
      <summary><span>{{piAdvanced}}</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary>
      <div class="pi-advanced-body">
        <div class="pi-grid">
          <label>{{piInteraction}}<select name="interaction" data-gpu-control><option value="flow">{{piFlow}}</option><option value="repel">{{piRepel}}</option><option value="attract">{{piAttract}}</option></select></label>
          <label>{{piPalette}}<select name="palette" data-gpu-control><option value="original">{{piOriginal}}</option><option value="brand">{{piBrand}}</option></select></label>
        </div>
        <label class="pi-slider"><span>{{piStrength}}<output data-value-strength>.5</output></span><input name="strength" type="range" min=".05" max="1.2" step=".05" value=".5" data-gpu-control></label>
        <label class="pi-slider"><span>{{piRadius}}<output data-value-radius>.26</output></span><input name="radius" type="range" min=".08" max=".8" step=".02" value=".26" data-gpu-control></label>
        <label class="pi-slider"><span>{{piSpeed}}<output data-value-speed>.5</output></span><input name="speed" type="range" min="0" max="1.5" step=".05" value=".5" data-gpu-control></label>
        <label class="pi-slider"><span>{{piSize}}<output data-value-pointsize>.8</output></span><input name="pointSize" type="range" min=".6" max="2.3" step=".1" value=".8" data-gpu-control></label>
        <label>{{quality}}<select name="quality" data-quality data-gpu-control><option value="adaptive">{{adaptive}}</option><option value="balanced">{{piBalanced}}</option><option value="high">{{high}}</option></select></label>
        <p class="pi-note" data-density-note>{{piAdaptiveNote}}</p>
        <p class="pi-count"><span data-engine>WebGL 2</span> · <span data-particle-count>82.000</span> {{points}}</p>
        <div class="pi-advanced-actions">
          <button type="button" class="v2-button" data-scatter aria-pressed="false">{{scatter}}</button>
          <button type="button" class="v2-button" data-effect-snapshot data-gpu-control aria-describedby="pi-dispersed-note" disabled>{{piEffectPng}}</button>
        </div>
        <p class="pi-note" id="pi-dispersed-note">{{piDispersedNote}}</p>
      </div>
    </details>
  </form>
  <div class="pi-primary-actions">
    <button type="button" class="pi-save v2-button v2-primary" data-snapshot aria-describedby="pi-export-size" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/></svg>
      <span>{{piDownloadPng}}</span>
    </button>
    <p class="pi-export-size" id="pi-export-size"><span>{{piStillPng}} · </span><output data-export-size aria-label="{{piExportSize}}" aria-live="polite">—</output></p>
  </div>
</section>
