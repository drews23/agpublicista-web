 .mi-c{--mi-animation:lmi-spark-c;transform-box:view-box;transform-origin:48px 49px;animation-duration:var(--mi-duration);animation-delay:var(--mi-delay,0ms);animation-timing-function:cubic-bezier(.22,.75,.22,1);animation-fill-mode:both;animation-iteration-count:1}svg.ln-motion-icon[data-icon="spark"].is-playing .mi-c,svg.ln-motion-icon[data-icon="spark"][data-trigger="once"] .mi-c,svg.ln-motion-icon[data-icon="spark"][data-trigger="loop"] .mi-c,svg.ln-motion-icon[data-icon="spark"]:focus-visible[data-trigger="interact"] .mi-c{animation-name:lmi-spark-c}@media(hover:hover) and (pointer:fine){svg.ln-motion-icon[data-icon="spark"][data-trigger="interact"]:hover .mi-c{animation-name:lmi-spark-c}}@keyframes lmi-spark-c{0%,85%,100%{opacity:.6}20%{opacity:.2}60%{opacity:1}}svg.ln-motion-icon[data-icon="spark"][data-trigger="loop"] :is(.mi-a,.mi-b,.mi-c){animation-duration:calc(var(--mi-duration)*2.5);animation-iteration-count:infinite}svg.ln-motion-icon[data-icon="spark"][data-paused="true"] :is(.mi-a,.mi-b,.mi-c){animation-play-state:paused!important}@media(prefers-reduced-motion:reduce){svg.ln-motion-icon[data-icon="spark"] :is(.mi-a,.mi-b,.mi-c){animation:none!important}}</style><path class="mi-line mi-fill mi-a" d="m29 10 5 16 16 5-16 5-5 16-5-16-16-5 16-5Z"/><path class="mi-line mi-b" d="M49 10v10m-5-5h10"/><circle class="mi-solid mi-c" cx="48" cy="49" r="2"/></svg>