<meta charset="utf-8">
<title>Lienzo · avatar A (favicon fiel)</title>
<style>
  :root {
    --tinta: #0a0a0f;
    --texto: #f4f3f8;
    --violeta: #8b7bff;
    --violeta-profundo: #6e5df2;
    --turquesa: #35d6c8;
    --ambar: #ffb454;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 800px;
    height: 800px;
    overflow: hidden;
    background: var(--tinta);
  }

  .lienzo {
    position: relative;
    width: 800px;
    height: 800px;
    overflow: hidden;
    /* Degradado de marca 135deg. La turquesa entra al 88 % para que el paso
       violeta->turquesa ocurra DENTRO del circulo visible: si se deja al 100 %
       vive en la esquina que el recorte se lleva y el disco lee violeta plano,
       perdiendo la firma cromatica del sitio. */
    background: linear-gradient(
      135deg,
      var(--violeta) 0%,
      var(--violeta-profundo) 54%,
      var(--turquesa) 88%
    );
  }

  /* Atmosfera de la casa: blooms radiales con `circle closest-side` y una cola
     transparente larga. El sizing por defecto (farthest-corner) dejaria un borde
     duro en el canto de la caja. Nada de sombras: la profundidad es luz. */
  .bloom {
    position: absolute;
    left: 0;
    top: 0;
  }

  /* 1 · realce violeta arriba a la izquierda */
  .bloom-violeta {
    left: 175px;
    top: 145px;
    width: 940px;
    height: 940px;
    margin-left: -470px;
    margin-top: -470px;
    background: radial-gradient(
      circle closest-side at 50% 50%,
      rgba(139, 123, 255, 0.92) 0%,
      rgba(139, 123, 255, 0.46) 34%,
      rgba(139, 123, 255, 0.16) 64%,
      rgba(139, 123, 255, 0) 100%
    );
  }

  /* 2 · contra-bloom turquesa abajo a la derecha, metido hacia dentro para
     que sobreviva al recorte circular en vez de morir en la esquina */
  .bloom-turquesa {
    left: 632px;
    top: 648px;
    width: 880px;
    height: 880px;
    margin-left: -440px;
    margin-top: -440px;
    background: radial-gradient(
      circle closest-side at 50% 50%,
      rgba(53, 214, 200, 0.95) 0%,
      rgba(53, 214, 200, 0.44) 33%,
      rgba(53, 214, 200, 0.15) 63%,
      rgba(53, 214, 200, 0) 100%
    );
  }

  /* 3 · nucleo de violeta profundo bajo la marca: hunde el centro para que el
     blanco de los chevrones tenga suelo oscuro sobre el que apoyarse. */
  .bloom-nucleo {
    left: 400px;
    top: 418px;
    width: 840px;
    height: 840px;
    margin-left: -420px;
    margin-top: -420px;
    background: radial-gradient(
      circle closest-side at 50% 50%,
      rgba(110, 93, 242, 0.86) 0%,
      rgba(110, 93, 242, 0.6) 30%,
      rgba(110, 93, 242, 0.22) 60%,
      rgba(110, 93, 242, 0) 100%
    );
  }

  /* 4 · halo ambar detras del punto, ya en su esquina. Discreto: el punto se
     sostiene por color propio, no por glow — a 48 px un halo difuso se lee
     como artefacto de compresion, no como luz. */
  .bloom-ambar {
    left: 604px;
    top: 196px;
    width: 250px;
    height: 250px;
    margin-left: -125px;
    margin-top: -125px;
    background: radial-gradient(
      circle closest-side at 50% 50%,
      rgba(255, 180, 84, 0.30) 0%,
      rgba(255, 180, 84, 0.12) 42%,
      rgba(255, 180, 84, 0) 100%
    );
  }

  /* aro interior: asegura la silueta del disco sobre fondo BLANCO (resultados
     de busqueda, incrustaciones), donde el violeta claro se quedaba justo. */
  .aro {
    position: absolute;
    left: 0;
    top: 0;
    width: 800px;
    height: 800px;
    border-radius: 50%;
    box-shadow: inset 0 0 0 6px rgba(10, 10, 15, 0.22);
  }

  .marca {
    position: absolute;
    left: 0;
    top: 0;
    width: 800px;
    height: 800px;
  }
</style>

<div class="lienzo">
  <div class="bloom bloom-violeta"></div>
  <div class="bloom bloom-turquesa"></div>
  <div class="bloom bloom-nucleo"></div>
  <div class="bloom bloom-ambar"></div>

  <!-- Chevrones del favicon, separados un punto mas de lo que van en la pestana:
       a 1:1 los remates redondos dejan solo 32 px de aire arriba y abajo y a
       48 px la pareja se cierra en un rombo. Aqui el hueco es de 84 px (10.5%
       del ancho, ~5 px reales a 48 px) y el gesto "< >" sobrevive.
       Vertices a 236 px del centro + 46 de medio trazo = 282 px de tinta maxima,
       dentro del circulo seguro de 344 px (86%) con 62 px de sobra.
       El punto ambar se queda ARRIBA A LA DERECHA como en el favicon del sitio
       (alli va en cx80/cy20 de 100), porque es el detalle que ata la pestana
       del navegador con la foto del canal. Solo se mete hacia dentro: a 72 %
       del radio (288 px del centro) en vez del 85 % del favicon, para que el
       recorte circular no lo muerda. Queda a ~30 px del trazo del chevron. -->
  <svg class="marca" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
    <g fill="none" stroke="#f4f3f8" stroke-width="92"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M312 252 164 400l148 148"/>
      <path d="M488 252 636 400 488 548"/>
    </g>
    <circle cx="604" cy="196" r="44" fill="#ffb454"/>
  </svg>
  <div class="aro"></div>
</div>
