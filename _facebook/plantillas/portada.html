<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400..700;1,400..700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=block" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1640px; height: 624px; overflow: hidden; }
  body {
    position: relative;
    background: #0a0a0f;
    font-family: "Instrument Sans", system-ui, sans-serif;
    color: #f4f3f8;
    display: grid;
    place-items: center;
  }
  /* manchas de luz, como en el sitio */
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); }
  .glow--v { width: 560px; height: 560px; left: 120px; top: -180px; background: #8b7bff; opacity: 0.22; }
  .glow--t { width: 480px; height: 480px; right: 140px; bottom: -200px; background: #35d6c8; opacity: 0.16; }
  /* rejilla tenue */
  .grid { position: absolute; inset: 0; opacity: 0.05;
    background-image: linear-gradient(#f4f3f8 1px, transparent 1px), linear-gradient(90deg, #f4f3f8 1px, transparent 1px);
    background-size: 72px 72px; }
  /* zona segura central: lo importante vive aqui */
  .centro { position: relative; text-align: center; width: 1120px; }
  .logo { width: 560px; display: block; margin: 0 auto 26px; }
  .tag {
    font-family: Fraunces, Georgia, serif; font-style: italic;
    font-size: 46px; font-weight: 500; color: #f4f3f8; letter-spacing: 0.01em;
  }
  .tag b { font-style: italic; font-weight: 600;
    background: linear-gradient(90deg, #8b7bff, #35d6c8);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .fila { display: flex; gap: 12px; justify-content: center; margin-top: 34px; flex-wrap: nowrap; }
  .chip {
    font-size: 22px; font-weight: 600; letter-spacing: 0.02em; white-space: nowrap;
    padding: 12px 22px; border-radius: 999px;
    border: 1px solid rgba(244, 243, 248, 0.18);
    background: rgba(255, 255, 255, 0.05);
    color: rgba(244, 243, 248, 0.88);
  }
  .chip--url { border-color: rgba(139, 123, 255, 0.55); color: #cdc5ff; background: rgba(139, 123, 255, 0.12); }
  .montes { position: absolute; left: 0; right: 0; bottom: -2px; height: 120px; opacity: 0.5; }
</style></head>
<body>
  <div class="glow glow--v"></div>
  <div class="glow glow--t"></div>
  <div class="grid"></div>
  <div class="centro">
    <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260"><defs><linearGradient id="marco" x1="28" x2="932" y1="11" y2="249" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8b7bff"/><stop offset=".55" stop-color="#6e5df2"/><stop offset="1" stop-color="#35d6c8"/></linearGradient></defs><g fill="none" stroke="url(#marco)" stroke-linecap="round" stroke-width="22"><path d="M28 100V46a35 35 0 0 1 35-35h468"/><path d="M621 11h276a35 35 0 0 1 35 35v54"/><path d="M932 160v54a35 35 0 0 1-35 35H545"/><path d="M455 249H63a35 35 0 0 1-35-35v-54"/></g><path fill="none" stroke="#ffb454" stroke-linecap="round" stroke-linejoin="round" stroke-width="22" d="m52 84-38 46 38 46m856-92 38 46-38 46"/><g fill="none" stroke="#f4f3f8" stroke-linecap="round" stroke-linejoin="round" stroke-width="26"><path d="M160 68v124h72m44-124v124M400 68h-80v124h80m-80-64h62m62 64V68l84 124V68m44 0h80l-80 124h80"/><ellipse cx="746" cy="130" rx="50" ry="64"/></g></svg>
    <p class="tag">Herramientas creativas <b>sin fricción</b></p>
    <div class="fila">
      <span class="chip">Sonidos</span>
      <span class="chip">Iconos SVG</span>
      <span class="chip">Plantillas</span>
      <span class="chip">Código CSS</span>
      <span class="chip">Generadores</span>
      <span class="chip chip--url">lienzo.tools</span>
    </div>
  </div>
  <svg class="montes" viewBox="0 0 1640 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0 120 420 34l260 66 240-86 300 86 420-52v72Z" fill="none" stroke="#8b7bff" stroke-width="2" opacity="0.6"/>
    <path d="M0 120 420 34l260 66 240-86 300 86 420-52v72Z" fill="url(#gm)"/>
    <defs><linearGradient id="gm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b7bff" stop-opacity="0.14"/><stop offset="1" stop-color="#0a0a0f" stop-opacity="0"/></linearGradient></defs>
  </svg>
</body></html>
