<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
  * { margin: 0; }
  html, body { width: 720px; height: 720px; overflow: hidden; }
  body { display: grid; place-items: center; background: #0a0a0f; }
  /* Facebook recorta el perfil en circulo: todo lo importante vive dentro
     del circulo inscrito, con margen. */
  .marca { width: 720px; height: 720px; display: block; }
</style></head>
<body>
  <svg class="marca" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8b7bff"/>
        <stop offset="0.6" stop-color="#6e5df2"/>
        <stop offset="1" stop-color="#35d6c8"/>
      </linearGradient>
    </defs>
    <rect width="100" height="100" fill="url(#g)"/>
    <g fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
      <path d="M44 32 26 50l18 18"/>
      <path d="M56 32 74 50 56 68"/>
    </g>
    <circle cx="69" cy="26" r="6" fill="#ffb454"/>
  </svg>
</body></html>
