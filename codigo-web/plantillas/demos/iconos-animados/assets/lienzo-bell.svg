<svg xmlns="http://www.w3.org/2000/svg" class="ln-motion-icon" data-icon="bell" data-style="duotone" data-trigger="interact" viewBox="0 0 64 64" width="112" height="112" fill="none" role="img" aria-label="Notificación" tabindex="0"><style data-static-style="">svg.ln-motion-icon[data-icon="bell"]{color:#8b7bff;--mi-duration:1000ms;--mi-stroke:2.2;overflow:visible}
svg.ln-motion-icon[data-icon="bell"] .mi-line{fill:none;stroke:currentColor;stroke-width:var(--mi-stroke);stroke-linecap:round;stroke-linejoin:round}
svg.ln-motion-icon[data-icon="bell"] .mi-solid{fill:currentColor;stroke:none}svg.ln-motion-icon[data-icon="bell"] .mi-soft{fill:currentColor;fill-opacity:.09;stroke:none}svg.ln-motion-icon[data-icon="bell"] .mi-guide{opacity:.2}svg.ln-motion-icon[data-icon="bell"] .mi-ripple{opacity:0}svg.ln-motion-icon[data-icon="bell"] .mi-detail{opacity:.55}
