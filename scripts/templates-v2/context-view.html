<section class="cm-workspace" aria-label="{{collectionLabel}}">
  <div class="cm-intro">
    <div><h2>{{collectionTitle}}</h2><p>{{collectionLead}}</p></div>
    <button class="v2-button v2-primary" type="button" data-try-context aria-haspopup="menu" aria-expanded="false" aria-controls="cm-resource-actions">{{contextTryMenu}} <span aria-hidden="true">⋯</span></button>
  </div>
  <div class="cm-commandbar"><label class="cm-search"><span data-search-icon aria-hidden="true"></span><span class="v2-sr">{{searchResources}}</span><input type="search" data-context-search placeholder="{{searchResources}}" maxlength="80" autocomplete="off"><kbd aria-hidden="true">/</kbd></label><div class="cm-filters" role="group" aria-label="{{filterResources}}"><button type="button" data-filter="all" aria-pressed="true">{{allResources}} <span data-total-count></span></button><button type="button" data-filter="saved" aria-pressed="false">{{favorites}} <span data-saved-count></span></button></div><div class="cm-views" role="group" aria-label="{{layout}}"><button type="button" data-context-view="grid" aria-pressed="true" aria-label="{{gridView}}"></button><button type="button" data-context-view="list" aria-pressed="false" aria-label="{{listView}}"></button></div></div>
  <div class="cm-desk"><div class="cm-collection"><div class="cm-board-heading"><p>{{yourCollection}}</p><span data-board-count></span></div><div class="cm-grid" data-context-cards data-layout="grid" data-export-empty></div><div class="cm-empty" data-context-empty hidden><span data-empty-icon aria-hidden="true"></span><h3>{{nothingHere}}</h3><p data-empty-message></p><button class="v2-button" type="button" data-clear-filter>{{clearFilters}}</button></div><div class="cm-undo" data-undo-wrap hidden><span data-undo-text></span><button type="button" class="v2-button" data-undo>{{undo}}</button></div><div class="cm-desk-note"><span>{{sampleCollection}}</span><span>{{contextShortcut}}</span></div></div>
  <aside class="cm-inspector" aria-label="{{selectedResource}}"><div class="cm-inspector-head"><span>{{selectedResource}}</span><span data-selected-index></span></div><div class="cm-selected-art" data-selected-art data-export-empty></div><div class="cm-inspector-body"><span class="cm-category" data-selected-category></span><h3 data-selected-title></h3><p data-selected-description></p><dl><div><dt>{{format}}</dt><dd data-selected-format>SVG + CSS</dd></div><div><dt>{{accent}}</dt><dd data-selected-accent></dd></div><div><dt>{{statusLabel}}</dt><dd data-selected-status></dd></div></dl><button type="button" class="v2-button v2-primary" data-selected-actions aria-haspopup="menu" aria-expanded="false" aria-controls="cm-resource-actions">{{openActions}} <span aria-hidden="true">⋯</span></button><button type="button" class="v2-text-button" data-selected-preview>{{previewResource}}</button></div><p class="cm-inspector-empty" data-inspector-empty hidden>{{chooseResource}}</p></aside></div>
  <div class="cm-foot"><span>{{localNotice}}</span><button class="v2-text-button" type="button" data-export-collection>{{exportCollection}} <span aria-hidden="true">↓</span></button></div>
</section>
<div class="cm-menu" id="cm-resource-actions" data-menu role="menu" aria-label="{{actions}}" hidden></div>
<div class="cm-submenu" data-submenu role="menu" aria-label="{{accent}}" hidden></div>
<dialog class="cm-preview" data-context-preview aria-labelledby="cm-preview-title"><div class="cm-preview-heading"><span class="v2-eyebrow">LIENZO / {{visualPreview}}</span><button type="button" class="v2-icon-button" data-close-preview aria-label="{{close}}">×</button></div><div class="cm-preview-art" data-preview-art data-export-empty></div><div class="cm-preview-body"><span class="cm-category" data-preview-category></span><h2 id="cm-preview-title" data-preview-title></h2><p data-preview-description></p><p class="cm-preview-note">{{sampleCollection}}</p><a class="v2-button v2-primary" data-preview-link target="_blank" rel="noopener noreferrer">{{details}} ↗</a></div></dialog>
