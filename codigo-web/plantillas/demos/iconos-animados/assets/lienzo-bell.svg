motion-icon[data-icon="bell"] .mi-c{--mi-animation:lmi-bell-c;transform-box:view-box;transform-origin:32px 32px;animation-duration:var(--mi-duration);animation-delay:var(--mi-delay,0ms);animation-timing-function:cubic-bezier(.22,.75,.22,1);animation-fill-mode:both;animation-iteration-count:1}svg.ln-motion-icon[data-icon="bell"].is-playing .mi-c,svg.ln-motion-icon[data-icon="bell"][data-trigger="once"] .mi-c,svg.ln-motion-icon[data-icon="bell"][data-trigger="loop"] .mi-c,svg.ln-motion-icon[data-icon="bell"]:focus-visible[data-trigger="interact"] .mi-c{animation-name:lmi-bell-c}@media(hover:hover) and (pointer:fine){svg.ln-motion-icon[data-icon="bell"][data-trigger="interact"]:hover .mi-c{animation-name:lmi-bell-c}}@keyframes lmi-bell-c{0%,80%,100%{opacity:.35}30%,50%{opacity:.8}}svg.ln-motion-icon[data-icon="bell"][data-trigger="loop"] :is(.mi-a,.mi-b,.mi-c){animation-duration:calc(var(--mi-duration)*2.5);animation-iteration-count:infinite}svg.ln-motion-icon[data-icon="bell"][data-paused="true"] :is(.mi-a,.mi-b,.mi-c){animation-play-state:paused!important}@media(prefers-reduced-motion:reduce){svg.ln-motion-icon[data-icon="bell"] :is(.mi-a,.mi-b,.mi-c){animation:none!important}}</style><g class="mi-a"><path class="mi-line mi-fill" d="M15 45h34l-5-8V27a12 12 0 0 0-24 0v10Z"/><path class="mi-line" d="M29 13v-2a3 3 0 0 1 6 0v2"/><path class="mi-line mi-b" d="M27 51a6 6 0 0 0 10 0"/></g><path class="mi-line mi-c mi-detail" d="M11 23c-2 4-2 8-1 11m43-11c2 4 2 8 1 11"/></svg>