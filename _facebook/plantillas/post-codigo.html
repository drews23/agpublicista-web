<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400..700;1,400..700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;600&display=block" rel="stylesheet">
<style>
  /* PLANTILLA POST-CODIGO 1080x1080 (pilar de codigo web)
     Cambiar por publicacion: .eyebrow, .titulo, el bloque .codigo y la
     .demo de la derecha. La demo se hace con CSS de verdad, no con una
     captura: asi lo que se ve es exactamente lo que hace el codigo. */
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body {
    position: relative; background: #0a0a0f;
    font-family: "Instrument Sans", system-ui, sans-serif; color: #f4f3f8;
    padding: 72px; display: flex; flex-direction: column;
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(100px); }
  .glow--v { width: 520px; height: 520px; left: -140px; top: -160px; background: #8b7bff; opacity: 0.2; }
  .glow--t { width: 460px; height: 460px; right: -130px; bottom: -150px; background: #35d6c8; opacity: 0.14; }
  header { position: relative; display: flex; justify-content: space-between; align-items: center; }
  .sello { display: flex; align-items: center; gap: 16px; font-weight: 700; font-size: 30px; letter-spacing: 0.14em; }
  .sello svg { width: 52px; height: 52px; border-radius: 14px; }
  .copiar { font-size: 24px; font-weight: 700; letter-spacing: 0.04em; color: #0a0a12;
    background: #35d6c8; border-radius: 999px; padding: 11px 26px; }
  .eyebrow { position: relative; margin-top: 46px; font-size: 27px; font-weight: 700;
    letter-spacing: 0.22em; color: #8b7bff; text-transform: uppercase; }
  .titulo { position: relative; margin-top: 20px; max-width: 15ch;
    font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 72px; line-height: 1.08; }
  .titulo em { font-style: italic;
    background: linear-gradient(90deg, #8b7bff, #35d6c8);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  main { position: relative; flex: 1; display: flex; align-items: center; gap: 34px; margin-top: 8px; }
  /* bloque de codigo, con los colores del sitio */
  .codigo {
    flex: 1.15; background: #12121a; border: 1px solid rgba(244,243,248,0.1);
    border-radius: 22px; padding: 30px 32px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 25px; line-height: 1.65; white-space: pre; color: #a2a1b3;
  }
  .k { color: #8b7bff; }   /* propiedad */
  .v { color: #35d6c8; }   /* valor */
  .n { color: #ffb454; }   /* numero */
  .c { color: #5d5c6e; }   /* comentario */
  /* la demo: el resultado real del codigo de la izquierda */
  .demo { flex: 0.85; height: 340px; border-radius: 22px;
    display: grid; place-items: center;
    background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.12); }
  .pieza {
    width: 200px; height: 200px; border-radius: 28px;
    background: linear-gradient(135deg, #8b7bff, #35d6c8);
    box-shadow: 0 0 60px rgba(139, 123, 255, 0.55), 0 0 120px rgba(53, 214, 200, 0.35);
  }
  footer { position: relative; display: flex; align-items: center; gap: 18px; }
  .dato { font-size: 26px; font-weight: 600; color: rgba(244,243,248,0.85);
    border: 1px solid rgba(244,243,248,0.16); background: rgba(255,255,255,0.05);
    border-radius: 999px; padding: 12px 26px; }
  .url { margin-left: auto; font-size: 30px; font-weight: 700; color: #cdc5ff; }
</style></head>
<body>
  <div class="glow glow--v"></div>
  <div class="glow glow--t"></div>
  <header>
    <div class="sello">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7bff"/><stop offset="0.6" stop-color="#6e5df2"/><stop offset="1" stop-color="#35d6c8"/></linearGradient></defs><rect width="100" height="100" rx="26" fill="url(#g)"/><g fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><path d="M42 30 22 50l20 20"/><path d="M58 30 78 50 58 70"/></g><circle cx="80" cy="20" r="7" fill="#ffb454"/></svg>
      LIENZO
    </div>
    <div class="copiar">COPIAR Y PEGAR</div>
  </header>
  <p class="eyebrow">Código web</p>
  <h1 class="titulo">Resplandor de neón en <em>3 líneas</em></h1>
  <main>
    <div class="codigo"><span class="c">/* glow neón */</span>
<span class="k">box-shadow</span>:
  <span class="n">0 0 60px</span> <span class="v">#8b7bff</span>,
  <span class="n">0 0 120px</span> <span class="v">#35d6c8</span>;
<span class="k">border-radius</span>: <span class="n">28px</span>;</div>
    <div class="demo"><div class="pieza"></div></div>
  </main>
  <footer>
    <span class="dato">CSS puro</span>
    <span class="dato">Sin librerías</span>
    <span class="url">lienzo.tools</span>
  </footer>
</body></html>
