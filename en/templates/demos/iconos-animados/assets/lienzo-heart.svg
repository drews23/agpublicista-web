<svg xmlns="http://www.w3.org/2000/svg" class="ln-motion-icon" data-icon="heart" data-style="duotone" data-trigger="interact" viewBox="0 0 64 64" width="112" height="112" fill="none" role="img" aria-label="Heart" tabindex="0"><style data-static-style="">svg.ln-motion-icon[data-icon="heart"]{color:#35d6c8;--mi-duration:1000ms;--mi-stroke:2.2;overflow:visible}
svg.ln-motion-icon[data-icon="heart"] .mi-line{fill:none;stroke:currentColor;stroke-width:var(--mi-stroke);stroke-linecap:round;stroke-linejoin:round}
svg.ln-motion-icon[data-icon="heart"] .mi-solid{fill:currentColor;stroke:none}svg.ln-motion-icon[data-icon="heart"] .mi-soft{fill:currentColor;fill-opacity:.09;stroke:none}svg.ln-motion-icon[data-icon="heart"] .mi-guide{opacity:.2}svg.ln-motion-icon[data-icon="heart"] .mi-ripple{opacity:0}svg.ln-motion-icon[data-icon="heart"] .mi-detail{opacity:.55}
svg.ln-motion-icon[data-icon="heart"] .mi-paper{fill:none}svg.ln-motion-icon[data-icon="heart"][data-style="duotone"] .mi-fill{fill:currentColor;fill-opacity:.12}svg.ln-motion-icon[data-icon="heart"][data-style="line"] .mi-soft{fill-opacity:0}</style><style data-motion-style="">svg.ln-motion-icon[data-icon="heart"] .mi-a{--mi-animation:lmi-heart-a;transform-box:view-box;transform-origin:32px 34px;animation-duration:var(--mi-duration);animation-delay:var(--mi-delay,0ms);animation-timing-function:cubic-bezier(.22,.75,.22,1);animation-fill-mode:both;animation-iteration-count:1}svg.ln-motion-icon[data-icon="heart"].is-playing .mi-a,svg.ln-motion-icon[data-icon="heart"][data-trigger="once"] .mi-a,svg.ln-motion-icon[data-icon="heart"][data-trigger="loop"] .mi-a,svg.ln-motion-icon[data-icon="heart"]:focus-visible[data-trigger="interact"] .mi-a{animation-name:lmi-heart-a}@media(hover:hover) and (pointer:fine){svg.ln-motion-icon[data-icon="heart"][data-trigger="interact"]:hover .mi-a{animation-name:lmi-heart-a}}@keyframes lmi-heart-a{0%,70%,100%{transform:scale(1)}22%{transform:scale(1.07)}38%{transform:scale(.98)}52%{transform:scale(1.035)}}svg.ln-motion-icon[data-icon="heart"] .mi-b{--mi-animation:lmi-heart-b;transform-box:view-box;transform-origin:32px 32px;animation-duration:var(--mi-duration);animation-delay:var(--mi-delay,0ms);animation-timing-function:cubic-bezier(.22,.75,.22,1);animation-fill-mode:both;animation-iteration-count:1}svg.ln-motion-icon[data-icon="heart"].is-playing .mi-b,svg.ln-motion-icon[data-icon="heart"][data-trigger="once"] .mi-b,svg.ln-motion-icon[data-icon="heart"][data-trigger="loop"] .mi-b,svg.ln-motion-icon[data-icon="heart"]:focus-visible[data-trigger="interact"] .mi-b{animation-name:lmi-heart-b}@media(hover:hover) and (pointer:fine){svg.ln-motion-icon[data-icon="heart"][data-trigger="interact"]:hover .mi-b{animation-name:lmi-heart-b}}@keyframes lmi-heart-b{0%,70%,100%{opacity:.5}22%,52%{opacity:1}}svg.ln-motion-icon[data-icon="heart"][data-trigger="loop"] :is(.mi-a,.mi-b,.mi-c){animation-duration:calc(var(--mi-duration)*2.5);animation-iteration-count:infinite}svg.ln-motion-icon[data-icon="heart"][data-paused="true"] :is(.mi-a,.mi-b,.mi-c){animation-play-state:paused!important}@media(prefers-reduced-motion:reduce){svg.ln-motion-icon[data-icon="heart"] :is(.mi-a,.mi-b,.mi-c){animation:none!important}}</style><path class="mi-line mi-fill mi-a" d="M32 51 13.5 33C3 22.5 17 7 28 17l4 4 4-4c11-10 25 5.5 14.5 16Z"/><path class="mi-line mi-b mi-detail" d="M17 22c1-3 4-4 7-2"/></svg>