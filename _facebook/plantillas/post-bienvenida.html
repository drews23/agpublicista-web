<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400..700;1,400..700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=block" rel="stylesheet">
<style>
  /* PLANTILLA POST-BIENVENIDA 1080x1080 (post fijado)
     Version cuadrada de la portada: la portada 1640x624 se recorta mal
     en el feed y en el post fijado, asi que esta pieza es la que se sube
     como imagen del primer post. No se cambia nada de esta salvo que la
     oferta del sitio cambie. */
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body {
    position: relative; background: #0a0a0f;
    font-family: "Instrument Sans", system-ui, sans-serif; color: #f4f3f8;
    padding: 88px 90px; display: flex; flex-direction: column; align-items: center;
    text-align: center;
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(110px); }
  .glow--v { width: 620px; height: 620px; left: -160px; top: -200px; background: #8b7bff; opacity: 0.22; }
  .glow--t { width: 540px; height: 540px; right: -170px; bottom: -190px; background: #35d6c8; opacity: 0.15; }
  .grid { position: absolute; inset: 0; opacity: 0.05;
    background-image: linear-gradient(#f4f3f8 1px, transparent 1px), linear-gradient(90deg, #f4f3f8 1px, transparent 1px);
    background-size: 72px 72px; }
  .logo { position: relative; width: 400px; margin-top: 42px; }
  .tag {
    position: relative; margin-top: 44px;
    font-family: Fraunces, Georgia, serif; font-style: italic;
    font-size: 54px; font-weight: 500; line-height: 1.18; max-width: 15ch;
  }
  .tag em { font-style: italic; font-weight: 600;
    background: linear-gradient(90deg, #8b7bff, #35d6c8);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .oferta {
    position: relative; margin-top: 60px; display: grid;
    grid-template-columns: repeat(3, 1fr); gap: 20px; width: 100%;
  }
  .item {
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    padding: 34px 12px; border-radius: 24px;
    border: 1px solid rgba(244, 243, 248, 0.12);
    background: rgba(255, 255, 255, 0.04);
  }
  .item svg { width: 56px; height: 56px; }
  .item span { font-size: 26px; font-weight: 600; color: rgba(244,243,248,0.9); }
  footer { position: relative; margin-top: auto;
    display: flex; align-items: center; gap: 18px; }
  .gratis { font-size: 25px; font-weight: 700; letter-spacing: 0.04em; color: #0a0a12;
    background: #ffb454; border-radius: 999px; padding: 12px 28px; }
  .url { font-size: 32px; font-weight: 700; color: #cdc5ff; }
</style></head>
<body>
  <div class="glow glow--v"></div>
  <div class="glow glow--t"></div>
  <div class="grid"></div>
  <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260"><defs><linearGradient id="marco" x1="28" x2="932" y1="11" y2="249" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8b7bff"/><stop offset=".55" stop-color="#6e5df2"/><stop offset="1" stop-color="#35d6c8"/></linearGradient></defs><g fill="none" stroke="url(#marco)" stroke-linecap="round" stroke-width="22"><path d="M28 100V46a35 35 0 0 1 35-35h468"/><path d="M621 11h276a35 35 0 0 1 35 35v54"/><path d="M932 160v54a35 35 0 0 1-35 35H545"/><path d="M455 249H63a35 35 0 0 1-35-35v-54"/></g><path fill="none" stroke="#ffb454" stroke-linecap="round" stroke-linejoin="round" stroke-width="22" d="m52 84-38 46 38 46m856-92 38 46-38 46"/><g fill="none" stroke="#f4f3f8" stroke-linecap="round" stroke-linejoin="round" stroke-width="26"><path d="M160 68v124h72m44-124v124M400 68h-80v124h80m-80-64h62m62 64V68l84 124V68m44 0h80l-80 124h80"/><ellipse cx="746" cy="130" rx="50" ry="64"/></g></svg>
  <p class="tag">Herramientas creativas <em>sin fricción</em></p>
  <div class="oferta">
    <div class="item">
      <svg viewBox="0 0 24 24" fill="none" stroke="#8b7bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M9 18V6l10-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>
      <span>Sonidos</span>
    </div>
    <div class="item">
      <svg viewBox="0 0 24 24" fill="none" stroke="#35d6c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span>Iconos SVG</span>
    </div>
    <div class="item">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ffb454" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      <span>Plantillas AE</span>
    </div>
    <div class="item">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ff7a68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M12 2 3 7l9 5 9-5-9-5Z"/><path d="M3 12l9 5 9-5M3 17l9 5 9-5"/></svg>
      <span>Escenas 3D</span>
    </div>
    <div class="item">
      <svg viewBox="0 0 24 24" fill="none" stroke="#8b7bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M8.5 8 4 12l4.5 4M15.5 8l4.5 4-4.5 4"/></svg>
      <span>Código CSS</span>
    </div>
    <div class="item">
      <svg viewBox="0 0 24 24" fill="none" stroke="#35d6c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M5 6h14M5 12h14M5 18h14"/><circle cx="9" cy="6" r="2" fill="#0a0a0f"/><circle cx="15" cy="12" r="2" fill="#0a0a0f"/><circle cx="8" cy="18" r="2" fill="#0a0a0f"/></svg>
      <span>Generadores</span>
    </div>
  </div>
  <footer>
    <span class="gratis">SIN REGISTRO</span>
    <span class="url">lienzo.tools</span>
  </footer>
</body></html>
