<svg xmlns="http://www.w3.org/2000/svg" class="ln-motion-icon" data-icon="search" data-style="duotone" data-trigger="interact" viewBox="0 0 64 64" width="112" height="112" fill="none" role="img" aria-label="Buscar" tabindex="0"><style data-static-style="">svg.ln-motion-icon[data-icon="search"]{color:#8b7bff;--mi-duration:1000ms;--mi-stroke:2.2;overflow:visible}
svg.ln-motion-icon[data-icon="search"] .mi-line{fill:none;stroke:currentColor;stroke-width:var(--mi-stroke);stroke-linecap:round;stroke-linejoin:round}
svg.ln-motion-icon[data-icon="search"] .mi-solid{fill:currentColor;stroke:none}svg.ln-motion-icon[data-icon="search"] .mi-soft{fill:currentColor;fill-opacity:.09;stroke:none}svg.ln-motion-icon[data-icon="search"] .mi-guide{opacity:.2}svg.ln-motion-icon[data-icon="search"] .mi-ripple{opacity:0}svg.ln-motion-icon[data-icon="search"] .mi-detail{opacity:.55}
svg.ln-motion-icon[data-icon="search"] .mi-paper{fill:none}svg.ln-motion-icon[data-icon="search"][data-style="duotone"] .mi-fill{fill:currentColor;fill-opacity:.12}svg.ln-motion-icon[data-icon="search"][data-style="line"] .mi-soft{fill-opacity:0}</style><style data-motion-style="">svg.ln-motion-icon[data-icon="search"] .mi-a{--mi-animation:lmi-search-a;transform-box:view-box;transform-origin:32px 32px;animation-duration:var(--mi-duration);animation-delay:var(--mi-delay,0ms);animation-timing-function:cubic-bezier(.22,.75,.22,1);animation-fill-mode:both;animation-iteration-count:1}svg.ln-motion-icon[data-icon="search"].is-playing .mi-a,svg.ln-motion-icon[data-icon="search"][data-trigger="once"] .mi-a,svg.ln-motion-icon[data-icon="search"][data-trigger="loop"] .mi-a,svg.ln-motion-icon[data-icon="search"]:focus-visible[data-trigger="interact"] .mi-a{animation-name:lmi-search-a}@media(hover:hover) and (pointer:fine){svg.ln-motion-icon[data-icon="search"][data-trigger="interact"]:hover .mi-a{animation-name:lmi-search-a}}@keyframes lmi-search-a{0%,85%,100%{transform:translate(0,0)}30%{transform:translate(2px,-2px)}55%{transform:translate(-1px,1px)}}svg.ln-motion-icon[data-icon="search"] .mi-b{--mi-animation:lmi-search-b;transform-box:view-box;transform-origin:27px 27px;animation-duration:var(--mi-duration);animation-delay:var(--mi-delay,0ms);animation-timing-function:cubic-bezier(.22,.75,.22,1);animation-fill-mode:both;animation-iteration-count:1}svg.ln-motion-icon[data-icon="search"].is-playing .mi-b,svg.ln-motion-icon[data-icon="search"][data-trigger="once"] .mi-b,svg.ln-motion-icon[data-icon="search"][data-trigger="loop"] .mi-b,svg.ln-motion-icon[data-icon="search"]:focus-visible[data-trigger="interact"] .mi-b{animation-name:lmi-search-b}@media(hover:hover) and (pointer:fine){svg.ln-motion-icon[data-icon="search"][data-trigger="interact"]:hover .mi-b{animation-name:lmi-search-b}}@keyframes lmi-search-b{0%,85%,100%{opacity:.4}35%{opacity:1}}svg.ln-motion-icon[data-icon="search"][data-trigger="loop"] :is(.mi-a,.mi-b,.mi-c){animation-duration:calc(var(--mi-duration)*2.5);animation-iteration-count:infinite}svg.ln-motion-icon[data-icon="search"][data-paused="true"] :is(.mi-a,.mi-b,.mi-c){animation-play-state:paused!important}@media(prefers-reduced-motion:reduce){svg.ln-motion-icon[data-icon="search"] :is(.mi-a,.mi-b,.mi-c){animation:none!important}}</style><g class="mi-a"><circle class="mi-line mi-fill" cx="27" cy="27" r="16"/><path class="mi-line mi-b mi-detail" d="M18 25a10 10 0 0 1 8-8"/><path class="mi-line" d="m39 39 14 14"/></g></svg>