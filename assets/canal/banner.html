<meta charset="utf-8">
<title>Lienzo - portada de canal</title>
<style>
  @font-face{font-family:Fraunces;src:url("fuentes/fraunces-var.woff2") format("woff2-variations");font-weight:100 900;font-style:normal;font-display:block}
  @font-face{font-family:"Instrument Sans";src:url("fuentes/instrument-var.woff2") format("woff2-variations");font-weight:100 900;font-style:normal;font-display:block}
  :root{
    --tinta:#0a0a0f; --texto:#f4f3f8; --apagado:#a2a1b3;
    --violeta:#8b7bff; --violeta-hondo:#6e5df2; --turquesa:#35d6c8;
    --ambar:#ffb454; --coral:#ff7a68;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:2560px;height:1440px;overflow:hidden}
  body{background:var(--tinta);position:relative;font-family:"Instrument Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}

  /* ---------- atmosfera: blooms radiales closest-side ---------- */
  .bloom{position:absolute;pointer-events:none}
  .b1{left:-260px;top:-170px;width:1500px;height:1300px;
      background:radial-gradient(circle closest-side, rgba(139,123,255,.30), rgba(139,123,255,.10) 55%, rgba(139,123,255,0) 100%)}
  .b2{right:-300px;bottom:-270px;width:1700px;height:1500px;
      background:radial-gradient(circle closest-side, rgba(53,214,200,.24), rgba(53,214,200,.07) 55%, rgba(53,214,200,0) 100%)}
  .b3{left:620px;top:290px;width:1520px;height:1220px;
      background:radial-gradient(circle closest-side, rgba(110,93,242,.26), rgba(110,93,242,.06) 60%, rgba(110,93,242,0) 100%)}
  .b4{right:500px;top:110px;width:840px;height:780px;
      background:radial-gradient(circle closest-side, rgba(255,180,84,.13), rgba(255,180,84,0) 100%)}
  .b5{left:170px;bottom:50px;width:920px;height:840px;
      background:radial-gradient(circle closest-side, rgba(255,122,104,.11), rgba(255,122,104,0) 100%)}

  /* trama fina de puntos: textura, nunca informacion */
  /* trama muy tenue y apartada del bloque de texto: textura, nunca ruido */
  .trama{position:absolute;inset:0;
    background-image:radial-gradient(circle closest-side, rgba(244,243,248,.035) 0%, rgba(244,243,248,0) 100%);
    background-size:46px 46px;
    -webkit-mask-image:radial-gradient(ellipse 46% 58% at 74% 50%, #000 0%, rgba(0,0,0,.22) 60%, rgba(0,0,0,0) 100%)}

  /* franja de escritorio: luz horizontal que sostiene la composicion */
  .franja{position:absolute;left:0;top:508px;width:2560px;height:423px;
    background:linear-gradient(90deg, rgba(139,123,255,0) 0%, rgba(139,123,255,.10) 18%, rgba(110,93,242,.13) 50%, rgba(53,214,200,.10) 82%, rgba(53,214,200,0) 100%)}
  .filo{position:absolute;left:0;width:2560px;height:1px;
    background:linear-gradient(90deg, rgba(244,243,248,0), rgba(244,243,248,.15) 28%, rgba(244,243,248,.20) 50%, rgba(244,243,248,.15) 72%, rgba(244,243,248,0))}
  .filo.arriba{top:508px}
  .filo.abajo{top:930px}

  /* ---------- refuerzo lateral y bandas: recortable sin perder sentido ---------- */
  .ghost{position:absolute;color:var(--texto);opacity:.10}
  .ghost .ico{width:100%;height:100%;display:block}
  /* flancos: viven DENTRO de la franja de escritorio (y 508-931) sin tocar sus bordes,
     para que el recorte no los ampute. Contraste bajo: acompañan, no compiten. */
  .g1{left:110px;top:566px;width:138px;height:138px;opacity:.075}
  .g2{left:286px;top:730px;width:104px;height:104px;opacity:.06;color:var(--violeta)}
  .g3{left:74px;top:772px;width:92px;height:92px;opacity:.05}
  .g4{left:2166px;top:566px;width:138px;height:138px;opacity:.075;color:var(--turquesa)}
  .g5{left:2360px;top:730px;width:112px;height:112px;opacity:.06}
  .g6{left:2118px;top:778px;width:92px;height:92px;opacity:.05;color:var(--ambar)}
  .g7{left:1180px;top:150px;width:180px;height:180px;opacity:.05}
  .g8{left:520px;top:1080px;width:200px;height:200px;opacity:.045;color:var(--violeta)}
  .g9{left:1880px;top:1110px;width:170px;height:170px;opacity:.045;color:var(--turquesa)}

  /* ---------- zona segura: 1546x423 en x507 y508 ---------- */
  .segura{position:absolute;left:507px;top:508px;width:1546px;height:423px;
    display:flex;align-items:center;justify-content:space-between;padding:0 64px}

  .izq{width:652px;flex:0 0 652px}
  .logo{width:404px;height:auto;display:block}
  .titular{margin-top:24px;font-family:Fraunces,Georgia,serif;font-weight:600;font-size:40px;line-height:1.16;
    letter-spacing:-.012em;color:var(--texto);white-space:pre-line}
  .titular .luz{background:linear-gradient(135deg,var(--violeta) 0%,var(--violeta-hondo) 46%,var(--turquesa) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .pie{margin-top:26px;display:flex;align-items:center;gap:18px}
  .dominio{font-size:31px;font-weight:600;letter-spacing:-.005em;color:var(--texto);
    padding-bottom:6px;
    background:linear-gradient(90deg,var(--violeta),var(--turquesa)) 0 100%/100% 3px no-repeat}
  .sep{width:6px;height:6px;border-radius:50%;background:var(--apagado);opacity:.65}
  .sin{font-size:24px;font-weight:500;color:var(--apagado)}

  .der{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:22px}
  .chip{display:flex;align-items:center;gap:11px;padding:9px 20px 10px;border-radius:999px;
    border:1px solid rgba(255,180,84,.40);background:rgba(255,180,84,.10);
    font-size:20px;font-weight:600;letter-spacing:.055em;text-transform:uppercase;color:var(--ambar)}
  .chip i{width:9px;height:9px;border-radius:50%;background:var(--ambar);display:block}

  .vitrina{display:flex;gap:20px}
  .tile{width:174px;height:190px;border-radius:24px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    border:1px solid rgba(244,243,248,.11);background:rgba(244,243,248,.035)}
  .tile .tile-ico{width:100px;height:100px}
  .ico{width:100%;height:100%;display:block}
  .tile-t{font-size:23px;font-weight:600;letter-spacing:-.005em;color:var(--texto)}
  .tile.violeta{color:var(--violeta);border-color:rgba(139,123,255,.32);
    background:radial-gradient(circle closest-side at 50% 34%, rgba(139,123,255,.20), rgba(139,123,255,0) 100%), rgba(244,243,248,.035)}
  .tile.turquesa{color:var(--turquesa);border-color:rgba(53,214,200,.32);
    background:radial-gradient(circle closest-side at 50% 34%, rgba(53,214,200,.19), rgba(53,214,200,0) 100%), rgba(244,243,248,.035)}
  .tile.ambar{color:var(--ambar);border-color:rgba(255,180,84,.32);
    background:radial-gradient(circle closest-side at 50% 34%, rgba(255,180,84,.19), rgba(255,180,84,0) 100%), rgba(244,243,248,.035)}
  .tile.coral{color:var(--coral);border-color:rgba(255,122,104,.34);
    background:radial-gradient(circle closest-side at 50% 34%, rgba(255,122,104,.19), rgba(255,122,104,0) 100%), rgba(244,243,248,.035)}
</style>
