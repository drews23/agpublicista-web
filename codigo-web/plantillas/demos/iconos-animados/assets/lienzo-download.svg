<svg xmlns="http://www.w3.org/2000/svg" class="ln-motion-icon" data-icon="download" data-style="duotone" data-trigger="interact" viewBox="0 0 64 64" width="112" height="112" fill="none" role="img" aria-label="Descargar" tabindex="0"><style data-static-style="">svg.ln-motion-icon[data-icon="download"]{color:#35d6c8;--mi-duration:1000ms;--mi-stroke:2.2;overflow:visible}
svg.ln-motion-icon[data-icon="download"] .mi-line{fill:none;stroke:currentColor;stroke-width:var(--mi-stroke);stroke-linecap:round;stroke-linejoin:round}
svg.ln-motion-icon[data-icon="download"] .mi-solid{fill:currentColor;stroke:none}svg.ln-motion-icon[data-icon="download"] .mi-soft{fill:currentColor;fill-opacity:.09;stroke:none}svg.ln-motion-icon[data-icon="download"] .mi-guide{opacity:.2}svg.ln-motion-icon[data-icon="download"] .mi-ripple{opacity:0}svg.ln-motion-icon[data-icon="download"] .mi-detail{opacity:.55}
svg.ln-motion-icon[data-icon="download"] .mi-paper{fill:none}svg.ln-motion-icon[data-icon="download"][data-style="duotone"] .mi-fill{fill:currentColor;fill-opacity:.12}svg.ln-motion-icon[data-icon="download"][data-style="line"] .mi-soft{fill-opacity:0}</style><style data-motion-style="">svg.ln-motion-icon[data-icon="download"] .mi-a{--mi-animation:lmi-download-a;transform-box:view-box;transform-origin:32px 32px;animation-duration:var(--mi-duration);animation-delay:var(--mi-delay,0ms);animation-timing-function:cubic-bezier(.22,.75,.22,1);animation-fill-mode:both;animation-iteration-count:1}svg.ln-motion-icon[data-icon="download"].is-playing .mi-a,svg.ln-motion-icon[data-icon="download"][data-trigger="once"] .mi-a,svg.ln-motion-icon[data-icon="download"][data-trigger="loop"] .mi-a,svg.ln-motion-icon[data-icon="download"]:focus-visible[data-trigger="interact"] .mi-a{animation-name:lmi-download-a}@media(hover:hover) and (pointer:fine){svg.ln-motion-icon[data-icon="download"][data-trigger="interact"]:hover .mi-a{animation-name:lmi-download-a}}@keyframes lmi-download-a{0%,80%,100%{transform:translateY(0)}35%{transform:translateY(4px)}58%{transform:translateY(-1px)}}svg.ln-motion-icon[data-icon="download"] .mi-b{--mi-animation:lmi-download-b;transform-box:view-box;transform-origin:32px 46px;animation-duration:var(--mi-duration);animation-delay:var(--mi-delay,0ms);animation-timing-function:cubic-bezier(.22,.75,.22,1);animation-fill-mode:both;animation-iteration-count:1}svg.ln-motion-icon[data-icon="download"].is-playing .mi-b,svg.ln-motion-icon[data-icon="download"][data-trigger="once"] .mi-b,svg.ln-motion-icon[data-icon="download"][data-trigger="loop"] .mi-b,svg.ln-motion-icon[data-icon="download"]:focus-visible[data-trigger="interact"] .mi-b{animation-name:lmi-download-b}@media(hover:hover) and (pointer:fine){svg.ln-motion-icon[data-icon="download"][data-trigger="interact"]:hover .mi-b{animation-name:lmi-download-b}}@keyframes lmi-download-b{0%,80%,100%{transform:translateY(0)}43%{transform:translateY(1.5px)}}svg.ln-motion-icon[data-icon="download"][data-trigger="loop"] :is(.mi-a,.mi-b,.mi-c){animation-duration:calc(var(--mi-duration)*2.5);animation-iteration-count:infinite}svg.ln-motion-icon[data-icon="download"][data-paused="true"] :is(.mi-a,.mi-b,.mi-c){animation-play-state:paused!important}@media(prefers-reduced-motion:reduce){svg.ln-motion-icon[data-icon="download"] :is(.mi-a,.mi-b,.mi-c){animation:none!important}}</style><path class="mi-soft" d="M10 40h44v13H10Z"/><path class="mi-line mi-a" d="M32 10v29m-10-9 10 10 10-10"/><path class="mi-line mi-b" d="M12 40v12h40V40"/></svg>