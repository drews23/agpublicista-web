<svg xmlns="http://www.w3.org/2000/svg" width="160" height="120" viewBox="0 0 160 120">
  <title>Gradient and clipping references</title>
  <defs>
    <linearGradient id="lienzo-paint" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#8b7bff"/><stop offset="1" stop-color="#35d6c8"/></linearGradient>
    <clipPath id="lienzo-window"><rect x="28" y="16" width="104" height="88" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#lienzo-window)"><rect x="12" y="4" width="136" height="112" fill="url(#lienzo-paint)"/><circle cx="121" cy="28" r="38" fill="#ffb454"/></g>
</svg>
