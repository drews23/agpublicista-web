<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400..700;1,400..700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=block" rel="stylesheet">
<style>
  /* PLANTILLA POST-TIP 1080x1080 (pilar 5, micro-tips)
     Cambiar por publicacion: .eyebrow, .frase y .apoyo. */
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body {
    position: relative; background: #0a0a0f;
    font-family: "Instrument Sans", system-ui, sans-serif; color: #f4f3f8;
    padding: 84px; display: flex; flex-direction: column;
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(110px); }
  .glow--v { width: 600px; height: 600px; left: 50%; top: -260px; transform: translateX(-50%); background: #8b7bff; opacity: 0.2; }
  .glow--a { width: 380px; height: 380px; right: -110px; bottom: -120px; background: #ffb454; opacity: 0.1; }
  header { position: relative; display: flex; justify-content: space-between; align-items: center; }
  .sello { display: flex; align-items: center; gap: 16px; font-weight: 700; font-size: 30px; letter-spacing: 0.14em; }
  .sello svg { width: 52px; height: 52px; border-radius: 14px; }
  .eyebrow { font-size: 27px; font-weight: 700; letter-spacing: 0.22em; color: #ffb454; text-transform: uppercase; }
  main { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 44px; }
  .comilla { width: 84px; height: 64px; }
  .frase { font-family: Fraunces, Georgia, serif; font-style: italic; font-weight: 550;
    font-size: 92px; line-height: 1.14; letter-spacing: -0.005em; max-width: 15ch; }
  .frase em { font-style: italic;
    background: linear-gradient(90deg, #8b7bff, #35d6c8);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .apoyo { font-size: 36px; line-height: 1.45; color: #a2a1b3; max-width: 34ch; }
  footer { position: relative; display: flex; justify-content: space-between; align-items: center;
    font-size: 30px; font-weight: 700; }
  .tema { color: rgba(244,243,248,0.65); font-weight: 600; }
  .url { color: #cdc5ff; }
</style></head>
<body>
  <div class="glow glow--v"></div>
  <div class="glow glow--a"></div>
  <header>
    <div class="sello">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7bff"/><stop offset="0.6" stop-color="#6e5df2"/><stop offset="1" stop-color="#35d6c8"/></linearGradient></defs><rect width="100" height="100" rx="26" fill="url(#g)"/><g fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><path d="M42 30 22 50l20 20"/><path d="M58 30 78 50 58 70"/></g><circle cx="80" cy="20" r="7" fill="#ffb454"/></svg>
      LIENZO
    </div>
    <p class="eyebrow">Tip de color</p>
  </header>
  <main>
    <svg class="comilla" viewBox="0 0 84 64" xmlns="http://www.w3.org/2000/svg"><path d="M4 64V38C4 16 16 4 36 0v14C24 18 20 26 20 36h16v28H4Zm48 0V38c0-22 12-34 32-38v14c-12 4-16 12-16 22h16v28H52Z" fill="#8b7bff" opacity="0.85"/></svg>
    <h1 class="frase">Si todos los colores gritan, <em>ninguno se oye</em>.</h1>
    <p class="apoyo">Un color manda, uno acompaña y uno acentúa. El 60-30-10 resuelve casi todas las dudas de paleta.</p>
  </main>
  <footer>
    <span class="tema">Teoría del color, en el blog</span>
    <span class="url">lienzo.tools</span>
  </footer>
</body></html>
