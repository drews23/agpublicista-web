<svg xmlns="http://www.w3.org/2000/svg" class="ln-motion-icon" data-icon="check" data-style="duotone" data-trigger="interact" viewBox="0 0 64 64" width="112" height="112" fill="none" role="img" aria-label="Check" tabindex="0"><style data-static-style="">svg.ln-motion-icon[data-icon="check"]{color:#ffb454;--mi-duration:1000ms;--mi-stroke:2.2;overflow:visible}
svg.ln-motion-icon[data-icon="check"] .mi-line{fill:none;stroke:currentColor;stroke-width:var(--mi-stroke);stroke-linecap:round;stroke-linejoin:round}
svg.ln-motion-icon[data-icon="check"] .mi-solid{fill:currentColor;stroke:none}svg.ln-motion-icon[data-icon="check"] .mi-soft{fill:currentColor;fill-opacity:.09;stroke:none}svg.ln-motion-icon[data-icon="check"] .mi-guide{opacity:.2}svg.ln-motion-icon[data-icon="check"] .mi-ripple{opacity:0}svg.ln-motion-icon[data-icon="check"] .mi-detail{opacity:.55}
svg.ln-motion-icon[data-icon="check"] .mi-paper{fill:none}svg.ln-motion-icon[data-icon="check"][data-style="duotone"] .mi-fill{fill:currentColor;fill-opacity:.12}svg.ln-motion-icon[data-icon="check"][data-style="line"] .mi-soft{fill-opacity:0}</style><style data-motion-style="">svg.ln-motion-icon[data-icon="check"] .mi-a{--mi-animation:lmi-check-a;transform-box:view-box;transform-origin:32px 32px;animation-duration:var(--mi-duration);animation-delay:var(--mi-delay,0ms);animation-timing-function:cubic-bezier(.22,.75,.22,1);animation-fill-mode:both;animation-iteration-count:1}svg.ln-motion-icon[data-icon="check"].is-playing .mi-a,svg.ln-motion-icon[data-icon="check"][data-trigger="once"] .mi-a,svg.ln-motion-icon[data-icon="check"][data-trigger="loop"] .mi-a,svg.ln-motion-icon[data-icon="check"]:focus-visible[data-trigger="interact"] .mi-a{animation-name:lmi-check-a}@media(hover:hover) and (pointer:fine){svg.ln-motion-icon[data-icon="check"][data-trigger="interact"]:hover .mi-a{animation-name:lmi-check-a}}@keyframes lmi-check-a{0%,80%,100%{transform:scale(1)}24%{transform:scale(1.045)}}svg.ln-motion-icon[data-icon="check"] .mi-b{--mi-animation:lmi-check-b;transform-box:view-box;transform-origin:32px 32px;animation-duration:var(--mi-duration);animation-delay:var(--mi-delay,0ms);animation-timing-function:cubic-bezier(.22,.75,.22,1);animation-fill-mode:both;animation-iteration-count:1}svg.ln-motion-icon[data-icon="check"].is-playing .mi-b,svg.ln-motion-icon[data-icon="check"][data-trigger="once"] .mi-b,svg.ln-motion-icon[data-icon="check"][data-trigger="loop"] .mi-b,svg.ln-motion-icon[data-icon="check"]:focus-visible[data-trigger="interact"] .mi-b{animation-name:lmi-check-b}@media(hover:hover) and (pointer:fine){svg.ln-motion-icon[data-icon="check"][data-trigger="interact"]:hover .mi-b{animation-name:lmi-check-b}}@keyframes lmi-check-b{0%{opacity:0;transform:scale(.82)}40%,100%{opacity:1;transform:scale(1)}}svg.ln-motion-icon[data-icon="check"][data-trigger="loop"] :is(.mi-a,.mi-b,.mi-c){animation-duration:calc(var(--mi-duration)*2.5);animation-iteration-count:infinite}svg.ln-motion-icon[data-icon="check"][data-paused="true"] :is(.mi-a,.mi-b,.mi-c){animation-play-state:paused!important}@media(prefers-reduced-motion:reduce){svg.ln-motion-icon[data-icon="check"] :is(.mi-a,.mi-b,.mi-c){animation:none!important}}</style><circle class="mi-line mi-fill mi-a" cx="32" cy="32" r="22"/><path class="mi-line mi-b" d="m21 32 7 7 15-16"/></svg>