<svg xmlns="http://www.w3.org/2000/svg" class="ln-motion-icon" data-icon="spark" data-style="duotone" data-trigger="interact" viewBox="0 0 64 64" width="112" height="112" fill="none" role="img" aria-label="Spark" tabindex="0"><style data-static-style="">svg.ln-motion-icon[data-icon="spark"]{color:#ffb454;--mi-duration:1000ms;--mi-stroke:2.2;overflow:visible}
svg.ln-motion-icon[data-icon="spark"] .mi-line{fill:none;stroke:currentColor;stroke-width:var(--mi-stroke);stroke-linecap:round;stroke-linejoin:round}
svg.ln-motion-icon[data-icon="spark"] .mi-solid{fill:currentColor;stroke:none}svg.ln-motion-icon[data-icon="spark"] .mi-soft{fill:currentColor;fill-opacity:.09;stroke:none}svg.ln-motion-icon[data-icon="spark"] .mi-guide{opacity:.2}svg.ln-motion-icon[data-icon="spark"] .mi-ripple{opacity:0}svg.ln-motion-icon[data-icon="spark"] .mi-detail{opacity:.55}
