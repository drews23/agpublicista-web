<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400..700;1,400..700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=block" rel="stylesheet">
<style>
  /* PLANTILLA REEL / HISTORIA 1080x1920 (portada de Reel o lamina de historia)
     Cambiar por publicacion: .eyebrow, .titulo, .detalle.
     Zona segura: Facebook tapa ~250 px arriba y ~420 px abajo con interfaz,
     por eso el contenido vive en la franja central. */
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    position: relative; background: #0a0a0f;
    font-family: "Instrument Sans", system-ui, sans-serif; color: #f4f3f8;
    padding: 280px 96px 440px; display: flex; flex-direction: column;
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(120px); }
  .glow--v { width: 700px; height: 700px; left: 50%; top: -280px; transform: translateX(-50%); background: #8b7bff; opacity: 0.22; }
  .glow--t { width: 560px; height: 560px; right: -180px; bottom: 200px; background: #35d6c8; opacity: 0.14; }
  .grid { position: absolute; inset: 0; opacity: 0.045;
    background-image: linear-gradient(#f4f3f8 1px, transparent 1px), linear-gradient(90deg, #f4f3f8 1px, transparent 1px);
    background-size: 80px 80px; }
  .sello { position: relative; display: flex; align-items: center; gap: 18px; font-weight: 700; font-size: 34px; letter-spacing: 0.14em; }
  .sello svg { width: 60px; height: 60px; border-radius: 16px; }
  main { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 44px; }
  .eyebrow { font-size: 32px; font-weight: 700; letter-spacing: 0.24em; color: #35d6c8; text-transform: uppercase; }
  .titulo { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 120px; line-height: 1.06; max-width: 11ch; }
  .titulo em { font-style: italic;
    background: linear-gradient(90deg, #8b7bff, #35d6c8);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .detalle { font-size: 44px; line-height: 1.4; color: #a2a1b3; max-width: 24ch; }
  .onda { position: relative; width: 100%; height: 130px; margin-top: 20px; }
  footer { position: relative; display: flex; align-items: center; gap: 20px; }
  .cta { font-size: 36px; font-weight: 700; color: #0a0a12; background: #ffb454;
    border-radius: 999px; padding: 20px 44px; }
  .url { font-size: 36px; font-weight: 700; color: #cdc5ff; margin-left: auto; }
</style></head>
<body>
  <div class="glow glow--v"></div>
  <div class="glow glow--t"></div>
  <div class="grid"></div>
  <div class="sello">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7bff"/><stop offset="0.6" stop-color="#6e5df2"/><stop offset="1" stop-color="#35d6c8"/></linearGradient></defs><rect width="100" height="100" rx="26" fill="url(#g)"/><g fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><path d="M42 30 22 50l20 20"/><path d="M58 30 78 50 58 70"/></g><circle cx="80" cy="20" r="7" fill="#ffb454"/></svg>
    LIENZO
  </div>
  <main>
    <p class="eyebrow">Sonido para editores</p>
    <h1 class="titulo">3 sonidos que <em>arreglan</em> un corte</h1>
    <p class="detalle">Whoosh, impacto y barrido. Escucha la diferencia con y sin ellos.</p>
    <svg class="onda" viewBox="0 0 900 130" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <g stroke="#8b7bff" stroke-width="8" stroke-linecap="round">
        <line x1="12" y1="45" x2="12" y2="85"/><line x1="48" y1="30" x2="48" y2="100"/>
        <line x1="84" y1="50" x2="84" y2="80"/><line x1="120" y1="15" x2="120" y2="115"/>
        <line x1="156" y1="40" x2="156" y2="90"/><line x1="192" y1="25" x2="192" y2="105"/>
        <line x1="228" y1="55" x2="228" y2="75"/><line x1="264" y1="10" x2="264" y2="120"/>
        <line x1="300" y1="35" x2="300" y2="95"/><line x1="336" y1="50" x2="336" y2="80"/>
      </g>
      <g stroke="#35d6c8" stroke-width="8" stroke-linecap="round">
        <line x1="372" y1="20" x2="372" y2="110"/><line x1="408" y1="45" x2="408" y2="85"/>
        <line x1="444" y1="8" x2="444" y2="122"/><line x1="480" y1="38" x2="480" y2="92"/>
        <line x1="516" y1="55" x2="516" y2="75"/><line x1="552" y1="22" x2="552" y2="108"/>
        <line x1="588" y1="42" x2="588" y2="88"/><line x1="624" y1="30" x2="624" y2="100"/>
      </g>
      <g stroke="#ffb454" stroke-width="8" stroke-linecap="round">
        <line x1="660" y1="50" x2="660" y2="80"/><line x1="696" y1="18" x2="696" y2="112"/>
        <line x1="732" y1="40" x2="732" y2="90"/><line x1="768" y1="28" x2="768" y2="102"/>
        <line x1="804" y1="52" x2="804" y2="78"/><line x1="840" y1="35" x2="840" y2="95"/>
        <line x1="876" y1="48" x2="876" y2="82"/>
      </g>
    </svg>
  </main>
  <footer>
    <span class="cta">Descarga gratis</span>
    <span class="url">lienzo.tools</span>
  </footer>
</body></html>
