<svg xmlns="http://www.w3.org/2000/svg" class="ln-motion-icon" data-icon="arrow" data-style="duotone" data-trigger="interact" viewBox="0 0 64 64" width="112" height="112" fill="none" role="img" aria-label="Flecha" tabindex="0"><style data-static-style="">svg.ln-motion-icon[data-icon="arrow"]{color:#35d6c8;--mi-duration:1000ms;--mi-stroke:2.2;overflow:visible}
svg.ln-motion-icon[data-icon="arrow"] .mi-line{fill:none;stroke:currentColor;stroke-width:var(--mi-stroke);stroke-linecap:round;stroke-linejoin:round}
svg.ln-motion-icon[data-icon="arrow"] .mi-solid{fill:currentColor;stroke:none}svg.ln-motion-icon[data-icon="arrow"] .mi-soft{fill:currentColor;fill-opacity:.09;stroke:none}svg.ln-motion-icon[data-icon="arrow"] .mi-guide{opacity:.2}svg.ln-motion-icon[data-icon="arrow"] .mi-ripple{opacity:0}svg.ln-motion-icon[data-icon="arrow"] .mi-detail{opacity:.55}
svg.ln-motion-icon[data-icon="arrow"] .mi-paper{fill:none}svg.ln-motion-icon[data-icon="arrow"][data-style="duotone"] .mi-fill{fill:currentColor;fill-opacity:.12}svg.ln-motion-icon[data-icon="arrow"][data-style="line"] .mi-soft{fill-opacity:0}</style><style data-motion-style="">svg.ln-motion-icon[data-icon="arrow"] .mi-a{--mi-animation:lmi-arrow-a;transform-box:view-box;transform-origin:32px 32px;animation-duration:var(--mi-duration);animation-delay:var(--mi-delay,0ms);animation-timing-function:cubic-bezier(.22,.75,.22,1);animation-fill-mode:both;animation-iteration-count:1}svg.ln-motion-icon[data-icon="arrow"].is-playing .mi-a,svg.ln-motion-icon[data-icon="arrow"][data-trigger="once"] .mi-a,svg.ln-motion-icon[data-icon="arrow"][data-trigger="loop"] .mi-a,svg.ln-motion-icon[data-icon="arrow"]:focus-visible[data-trigger="interact"] .mi-a{animation-name:lmi-arrow-a}@media(hover:hover) and (pointer:fine){svg.ln-motion-icon[data-icon="arrow"][data-trigger="interact"]:hover .mi-a{animation-name:lmi-arrow-a}}@keyframes lmi-arrow-a{0%,80%,100%{transform:translateX(0)}38%{transform:translateX(4px)}60%{transform:translateX(-1px)}}svg.ln-motion-icon[data-icon="arrow"] .mi-b{--mi-animation:lmi-arrow-b;transform-box:view-box;transform-origin:32px 32px;animation-duration:var(--mi-duration);animation-delay:var(--mi-delay,0ms);animation-timing-function:cubic-bezier(.22,.75,.22,1);animation-fill-mode:both;animation-iteration-count:1}svg.ln-motion-icon[data-icon="arrow"].is-playing .mi-b,svg.ln-motion-icon[data-icon="arrow"][data-trigger="once"] .mi-b,svg.ln-motion-icon[data-icon="arrow"][data-trigger="loop"] .mi-b,svg.ln-motion-icon[data-icon="arrow"]:focus-visible[data-trigger="interact"] .mi-b{animation-name:lmi-arrow-b}@media(hover:hover) and (pointer:fine){svg.ln-motion-icon[data-icon="arrow"][data-trigger="interact"]:hover .mi-b{animation-name:lmi-arrow-b}}@keyframes lmi-arrow-b{0%,80%,100%{opacity:.35;transform:translateX(0)}30%{opacity:.7;transform:translateX(2px)}}svg.ln-motion-icon[data-icon="arrow"][data-trigger="loop"] :is(.mi-a,.mi-b,.mi-c){animation-duration:calc(var(--mi-duration)*2.5);animation-iteration-count:infinite}svg.ln-motion-icon[data-icon="arrow"][data-paused="true"] :is(.mi-a,.mi-b,.mi-c){animation-play-state:paused!important}@media(prefers-reduced-motion:reduce){svg.ln-motion-icon[data-icon="arrow"] :is(.mi-a,.mi-b,.mi-c){animation:none!important}}</style><circle class="mi-soft" cx="32" cy="32" r="23"/><g class="mi-a"><path class="mi-line" d="M14 32h34m-12-12 12 12-12 12"/></g><path class="mi-line mi-b mi-detail" d="M12 24h8m-8 16h8"/></svg>