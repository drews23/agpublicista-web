<section class="lp-studio" data-laptop-perspective data-media="sample" aria-label="{{lpStage}}">
  <div class="lp-stage-head">
    <p class="lp-eyebrow"><i aria-hidden="true"></i>{{lpStage}} <span class="lp-orbit-badge" aria-hidden="true">360°</span></p>
    <p class="lp-media-label" data-lp-media-label>{{lpSample}}</p>
  </div>
  <div class="lp-composition">
    <div class="lp-device" data-lp-device>
      <img class="lp-shell" src="assets/laptop-perspective.webp" width="1536" height="1024" alt="" decoding="async" fetchpriority="high">
      <div class="lp-orbit" data-lp-orbit data-export-empty></div>
      <div class="lp-screen" data-lp-screen data-fit="contain" data-projected="false" role="region" aria-label="{{lpScreen}}">
        <div class="lp-sample" data-lp-sample>
          <img class="lp-sample-photo" src="assets/museum-atrium.webp" width="1024" height="768" alt="{{lpSamplePhotoAlt}}" decoding="async">
          <div class="lp-sample-top">
            <b data-lp-project-name data-brand-display>{{lpProjectNameSample}}</b>
            <span>01 / {{lpSampleEdition}}</span>
          </div>
          <div class="lp-sample-content">
            <div class="lp-sample-copy">
              <p>{{lpSampleKicker}}</p>
              <h2 data-lp-project-title data-brand-display>{{lpProjectTitleSample}}</h2>
              <p data-lp-project-copy>{{lpProjectCopySample}}</p>
            </div>
          </div>
          <div class="lp-sample-foot"><span>{{lpSampleEdition}}</span><span>01 / 01</span></div>
        </div>
        <img class="lp-image" data-lp-image alt="{{lpImageAlt}}" decoding="async" hidden>
        <video class="lp-video" data-lp-video aria-label="{{lpVideoLabel}}" playsinline muted preload="metadata" hidden></video>
      </div>
    </div>
    <aside class="lp-stage-note">
      <p class="lp-stage-kicker">{{lpStageKicker}}</p>
      <strong>{{lpStageTitle}}</strong>
      <p><span class="lp-static-note">{{lpStageHint}}</span><span class="lp-orbit-note">{{lpOrbitHint}}</span></p>
      <button type="button" class="v2-button" data-lp-open-media>{{lpOpenMedia}}</button>
    </aside>
  </div>
  <div class="lp-transport" data-lp-transport role="group" aria-label="{{lpPlayback}}" hidden>
    <button type="button" class="v2-button" data-lp-play>
      <span data-lp-play-icon aria-hidden="true"></span>
      <span data-lp-play-label>{{lpPlay}}</span>
    </button>
    <label class="lp-seek">
      <span class="v2-sr">{{lpSeek}}</span>
      <input type="range" data-lp-seek min="0" max="0" step=".1" value="0">
    </label>
    <span class="lp-elapsed" data-lp-elapsed aria-hidden="true">0:00 / 0:00</span>
    <button type="button" class="v2-text-button" data-lp-audio aria-pressed="false">
      <span data-lp-audio-icon aria-hidden="true"></span>
      <span data-lp-audio-label>{{lpAudio}}</span>
    </button>
  </div>
</section>
<section class="lp-settings" aria-label="{{lpMediaSettings}}">
  <div class="lp-upload-row">
    <label class="v2-upload v2-button v2-primary">
      <span>{{lpChooseVideo}}</span>
      <input type="file" data-lp-video-upload accept=".mp4,video/mp4" aria-describedby="lp-file-help">
    </label>
    <label class="v2-upload v2-button">
      <span>{{lpChooseImage}}</span>
      <input type="file" data-lp-image-upload accept="image/png,image/jpeg,image/webp" aria-describedby="lp-file-help">
    </label>
  </div>
  <p class="lp-media-help" id="lp-file-help">{{lpFileHelp}}</p>
  <p class="lp-media-status" data-lp-media-status data-export-empty role="status"></p>
  <label class="lp-fit" data-lp-fit-field hidden>{{lpFit}}
    <select data-lp-fit>
      <option value="contain">{{lpContain}}</option>
      <option value="cover">{{lpCover}}</option>
    </select>
  </label>
  <button type="button" class="v2-text-button" data-lp-remove hidden>{{lpRestore}}</button>
</section>
