<svg xmlns="http://www.w3.org/2000/svg" class="ln-motion-icon" data-icon="folder" data-style="duotone" data-trigger="interact" viewBox="0 0 64 64" width="112" height="112" fill="none" role="img" aria-label="Carpeta" tabindex="0"><style data-static-style="">svg.ln-motion-icon[data-icon="folder"]{color:#8b7bff;--mi-duration:1000ms;--mi-stroke:2.2;overflow:visible}
