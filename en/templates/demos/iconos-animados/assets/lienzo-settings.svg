<svg xmlns="http://www.w3.org/2000/svg" class="ln-motion-icon" data-icon="settings" data-style="duotone" data-trigger="interact" viewBox="0 0 64 64" width="112" height="112" fill="none" role="img" aria-label="Settings" tabindex="0"><style data-static-style="">svg.ln-motion-icon[data-icon="settings"]{color:#35d6c8;--mi-duration:1000ms;--mi-stroke:2.2;overflow:visible}
svg.ln-motion-icon[data-icon="settings"] .mi-line{fill:none;stroke:currentColor;stroke-width:var(--mi-stroke);stroke-linecap:round;stroke-linejoin:round}
svg.ln-motion-icon[data-icon="settings"] .mi-solid{fill:currentColor;stroke:none}svg.ln-motion-icon[data-icon="settings"] .mi-soft{fill:currentColor;fill-opacity:.09;stroke:none}svg.ln-motion-icon[data-icon="settings"] .mi-guide{opacity:.2}svg.ln-motion-icon[data-icon="settings"] .mi-ripple{opacity:0}svg.ln-motion-icon[data-icon="settings"] .mi-detail{opacity:.55}
svg.ln-motion-icon[data-icon="settings"] .mi-paper{fill:none}svg.ln-motion-icon[data-icon="settings"][data-style="duotone"] .mi-fill{fill:currentColor;fill-opacity:.12}svg.ln-motion-icon[data-icon="settings"][data-style="line"] .mi-soft{fill-opacity:0}</style><style data-motion-style="">svg.ln-motion-icon[data-icon="settings"] .mi-a{--mi-animation:lmi-settings-a;transform-box:view-box;transform-origin:32px 31.5px;animation-duration:var(--mi-duration);animation-delay:var(--mi-delay,0ms);animation-timing-function:cubic-bezier(.22,.75,.22,1);animation-fill-mode:both;animation-iteration-count:1}svg.ln-motion-icon[data-icon="settings"].is-playing .mi-a,svg.ln-motion-icon[data-icon="settings"][data-trigger="once"] .mi-a,svg.ln-motion-icon[data-icon="settings"][data-trigger="loop"] .mi-a,svg.ln-motion-icon[data-icon="settings"]:focus-visible[data-trigger="interact"] .mi-a{animation-name:lmi-settings-a}@media(hover:hover) and (pointer:fine){svg.ln-motion-icon[data-icon="settings"][data-trigger="interact"]:hover .mi-a{animation-name:lmi-settings-a}}@keyframes lmi-settings-a{0%,80%,100%{transform:rotate(0)}40%{transform:rotate(20deg)}62%{transform:rotate(-3deg)}}svg.ln-motion-icon[data-icon="settings"] .mi-b{--mi-animation:lmi-settings-b;transform-box:view-box;transform-origin:32px 31.5px;animation-duration:var(--mi-duration);animation-delay:var(--mi-delay,0ms);animation-timing-function:cubic-bezier(.22,.75,.22,1);animation-fill-mode:both;animation-iteration-count:1}svg.ln-motion-icon[data-icon="settings"].is-playing .mi-b,svg.ln-motion-icon[data-icon="settings"][data-trigger="once"] .mi-b,svg.ln-motion-icon[data-icon="settings"][data-trigger="loop"] .mi-b,svg.ln-motion-icon[data-icon="settings"]:focus-visible[data-trigger="interact"] .mi-b{animation-name:lmi-settings-b}@media(hover:hover) and (pointer:fine){svg.ln-motion-icon[data-icon="settings"][data-trigger="interact"]:hover .mi-b{animation-name:lmi-settings-b}}@keyframes lmi-settings-b{0%,80%,100%{opacity:.55}40%{opacity:1}}svg.ln-motion-icon[data-icon="settings"][data-trigger="loop"] :is(.mi-a,.mi-b,.mi-c){animation-duration:calc(var(--mi-duration)*2.5);animation-iteration-count:infinite}svg.ln-motion-icon[data-icon="settings"][data-paused="true"] :is(.mi-a,.mi-b,.mi-c){animation-play-state:paused!important}@media(prefers-reduced-motion:reduce){svg.ln-motion-icon[data-icon="settings"] :is(.mi-a,.mi-b,.mi-c){animation:none!important}}</style><g class="mi-a"><path class="mi-line mi-fill" d="m28 8 8 0 2 7 5 3 7-2 4 7-5 5v7l5 5-4 7-7-2-5 3-2 7h-8l-2-7-5-3-7 2-4-7 5-5v-7l-5-5 4-7 7 2 5-3Z"/><circle class="mi-line mi-paper" cx="32" cy="31.5" r="8"/></g><circle class="mi-solid mi-b" cx="32" cy="31.5" r="2"/></svg>