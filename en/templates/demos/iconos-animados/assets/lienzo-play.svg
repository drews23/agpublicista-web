<svg xmlns="http://www.w3.org/2000/svg" class="ln-motion-icon" data-icon="play" data-style="duotone" data-trigger="interact" viewBox="0 0 64 64" width="112" height="112" fill="none" role="img" aria-label="Play" tabindex="0"><style data-static-style="">svg.ln-motion-icon[data-icon="play"]{color:#8b7bff;--mi-duration:1000ms;--mi-stroke:2.2;overflow:visible}
svg.ln-motion-icon[data-icon="play"] .mi-line{fill:none;stroke:currentColor;stroke-width:var(--mi-stroke);stroke-linecap:round;stroke-linejoin:round}
svg.ln-motion-icon[data-icon="play"] .mi-solid{fill:currentColor;stroke:none}svg.ln-motion-icon[data-icon="play"] .mi-soft{fill:currentColor;fill-opacity:.09;stroke:none}svg.ln-motion-icon[data-icon="play"] .mi-guide{opacity:.2}svg.ln-motion-icon[data-icon="play"] .mi-ripple{opacity:0}svg.ln-motion-icon[data-icon="play"] .mi-detail{opacity:.55}
svg.ln-motion-icon[data-icon="play"] .mi-paper{fill:none}svg.ln-motion-icon[data-icon="play"][data-style="duotone"] .mi-fill{fill:currentColor;fill-opacity:.12}svg.ln-motion-icon[data-icon="play"][data-style="line"] .mi-soft{fill-opacity:0}</style><style data-motion-style="">svg.ln-motion-icon[data-icon="play"] .mi-a{--mi-animation:lmi-play-a;transform-box:view-box;transform-origin:32px 32px;animation-duration:var(--mi-duration);animation-delay:var(--mi-delay,0ms);animation-timing-function:cubic-bezier(.22,.75,.22,1);animation-fill-mode:both;animation-iteration-count:1}svg.ln-motion-icon[data-icon="play"].is-playing .mi-a,svg.ln-motion-icon[data-icon="play"][data-trigger="once"] .mi-a,svg.ln-motion-icon[data-icon="play"][data-trigger="loop"] .mi-a,svg.ln-motion-icon[data-icon="play"]:focus-visible[data-trigger="interact"] .mi-a{animation-name:lmi-play-a}@media(hover:hover) and (pointer:fine){svg.ln-motion-icon[data-icon="play"][data-trigger="interact"]:hover .mi-a{animation-name:lmi-play-a}}@keyframes lmi-play-a{0%{opacity:0;transform:scale(.83)}25%{opacity:.5}70%,100%{opacity:0;transform:scale(1.2)}}svg.ln-motion-icon[data-icon="play"] .mi-b{--mi-animation:lmi-play-b;transform-box:view-box;transform-origin:32px 32px;animation-duration:var(--mi-duration);animation-delay:var(--mi-delay,0ms);animation-timing-function:cubic-bezier(.22,.75,.22,1);animation-fill-mode:both;animation-iteration-count:1}svg.ln-motion-icon[data-icon="play"].is-playing .mi-b,svg.ln-motion-icon[data-icon="play"][data-trigger="once"] .mi-b,svg.ln-motion-icon[data-icon="play"][data-trigger="loop"] .mi-b,svg.ln-motion-icon[data-icon="play"]:focus-visible[data-trigger="interact"] .mi-b{animation-name:lmi-play-b}@media(hover:hover) and (pointer:fine){svg.ln-motion-icon[data-icon="play"][data-trigger="interact"]:hover .mi-b{animation-name:lmi-play-b}}@keyframes lmi-play-b{0%,75%,100%{transform:translateX(0)}30%{transform:translateX(2px)}50%{transform:translateX(-.5px)}}svg.ln-motion-icon[data-icon="play"][data-trigger="loop"] :is(.mi-a,.mi-b,.mi-c){animation-duration:calc(var(--mi-duration)*2.5);animation-iteration-count:infinite}svg.ln-motion-icon[data-icon="play"][data-paused="true"] :is(.mi-a,.mi-b,.mi-c){animation-play-state:paused!important}@media(prefers-reduced-motion:reduce){svg.ln-motion-icon[data-icon="play"] :is(.mi-a,.mi-b,.mi-c){animation:none!important}}</style><circle class="mi-line mi-guide" cx="32" cy="32" r="23"/><circle class="mi-line mi-a mi-ripple" cx="32" cy="32" r="21"/><path class="mi-line mi-fill mi-b" d="M26 21.5a1.5 1.5 0 0 1 2.3-1.3l17 10.5a1.5 1.5 0 0 1 0 2.6l-17 10.5a1.5 1.5 0 0 1-2.3-1.3Z"/></svg>