<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400..700;1,400..700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=block" rel="stylesheet">
<style>
  /* PLANTILLA POST-VIDEO 1080x1080 (anuncio de video nuevo del canal)
     Cambiar por publicacion: .eyebrow, .titulo y .detalle. */
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body {
    position: relative; background: #0a0a0f;
    font-family: "Instrument Sans", system-ui, sans-serif; color: #f4f3f8;
    padding: 72px; display: flex; flex-direction: column;
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(100px); }
  .glow--c { width: 520px; height: 520px; right: -140px; top: -160px; background: #ff7a68; opacity: 0.14; }
  .glow--v { width: 560px; height: 560px; left: -140px; bottom: -180px; background: #8b7bff; opacity: 0.2; }
  header { position: relative; display: flex; justify-content: space-between; align-items: center; }
  .sello { display: flex; align-items: center; gap: 16px; font-weight: 700; font-size: 30px; letter-spacing: 0.14em; }
  .sello svg { width: 52px; height: 52px; border-radius: 14px; }
  .nuevo { font-size: 26px; font-weight: 700; letter-spacing: 0.08em; color: #0a0a12;
    background: #35d6c8; border-radius: 999px; padding: 10px 26px; }
  main { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 36px; }
  .play { width: 148px; height: 148px; border-radius: 50%; display: grid; place-items: center;
    background: linear-gradient(135deg, #8b7bff, #6e5df2);
    box-shadow: 0 24px 60px rgba(110, 93, 242, 0.45); }
  .play svg { width: 56px; height: 56px; margin-left: 10px; }
  .eyebrow { font-size: 28px; font-weight: 700; letter-spacing: 0.22em; color: #ff7a68; text-transform: uppercase; }
  .titulo { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 96px; line-height: 1.06; max-width: 12ch; }
  .titulo em { font-style: italic;
    background: linear-gradient(90deg, #8b7bff, #35d6c8);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .detalle { font-size: 36px; line-height: 1.4; color: #a2a1b3; max-width: 26ch; }
  footer { position: relative; display: flex; justify-content: space-between; align-items: center;
    font-size: 30px; font-weight: 700; }
  .canal { display: flex; align-items: center; gap: 14px; color: rgba(244,243,248,0.75); font-weight: 600; }
  .canal svg { width: 40px; height: 40px; }
  .url { color: #cdc5ff; }
</style></head>
<body>
  <div class="glow glow--c"></div>
  <div class="glow glow--v"></div>
  <header>
    <div class="sello">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7bff"/><stop offset="0.6" stop-color="#6e5df2"/><stop offset="1" stop-color="#35d6c8"/></linearGradient></defs><rect width="100" height="100" rx="26" fill="url(#g)"/><g fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><path d="M42 30 22 50l20 20"/><path d="M58 30 78 50 58 70"/></g><circle cx="80" cy="20" r="7" fill="#ffb454"/></svg>
      LIENZO
    </div>
    <div class="nuevo">VIDEO NUEVO</div>
  </header>
  <main>
    <div class="play">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M5 3.5v17L21 12Z" fill="#fff"/></svg>
    </div>
    <p class="eyebrow">Técnicas de edición</p>
    <h1 class="titulo">Así se ve una <em>edición dinámica</em> en CapCut</h1>
    <p class="detalle">Cortes al beat, zooms con intención y sonido que acompaña. Con ejemplos reales.</p>
  </main>
  <footer>
    <span class="canal">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="4.5" width="21" height="15" rx="4" fill="#ff7a68"/><path d="M10 9v6l5.5-3Z" fill="#fff"/></svg>
      En YouTube: Lienzo
    </span>
    <span class="url">lienzo.tools</span>
  </footer>
</body></html>
